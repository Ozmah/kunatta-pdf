name: CI

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Glados (format, lint, typecheck and build)
        run: bun run glados

      - name: Run Shodan (tests)
        run: bun run shodan

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Build and check the preview image
        run: |
          docker build --build-arg APP_ENV=preview --tag kunatta:preview .
          sh deploy/smoke.sh kunatta:preview preview 3100

      # A placeholder key: the production build only ships analytics with one.
      - name: Build and check the production image
        run: |
          docker build \
            --build-arg APP_ENV=production \
            --build-arg PUBLIC_POSTHOG_KEY=phc_ciPlaceholderKeyForTheSmokeTest \
            --tag kunatta:production .
          sh deploy/smoke.sh kunatta:production production 3101

      # Against the image, so the tests run under the real Content-Security-Policy and 404s.
      - name: Run end-to-end tests on the preview image (Chromium, Firefox and a phone)
        run: sh deploy/e2e-image.sh kunatta:preview 3200

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
